services:
  redis:
    image: redis:latest
    container_name: fulturate_redis
    restart: unless-stopped
    networks:
      - fulturate-net
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:latest
    container_name: fulturate_mongo
    restart: unless-stopped
    networks:
      - fulturate-net
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      target: api-release
    container_name: fulturate_api
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - fulturate-net
    ports:
      - "3000:3000" # TODO: can we get this from command-line arguments too?
    environment:
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info,api=debug

  telegram_api:
    image: aiogram/telegram-bot-api:latest
    container_name: fulturate_telegram_api
    restart: unless-stopped
    networks:
      - fulturate-net
    ports:
      - "8081:8081"
    environment:
      # https://my.telegram.org | https://github.com/aiogram/telegram-bot-api
      - TELEGRAM_API_ID=28090001
      - TELEGRAM_API_HASH=a38cfe08329526d8cb130acbdddacbbd
      - TELEGRAM_LOCAL=1
      # - TELEGRAM_STAT=1
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api

  fulturate:
    build:
      context: .
      target: fulturate-release
    container_name: fulturate_bot
    restart: unless-stopped
    depends_on:
      - redis
      #      - api
      - mongo
      - telegram_api
    networks:
      - fulturate-net
    environment:
      - RUST_LOG=trace
      - BOT_TOKEN=7643136153:AAGGOdjQXtBnEUwFqFfvkrvo7AsxNssWzBA
      - GEMINI_API_KEY=AIzaSyDnY18JX8tJpnLFLdWqnQDNoi6RGQqoH4I
      - OWNERS=701733705,6452350296
      - MONGODB_URL=mongodb://mongo:27017/?w=majority&journal=true
#      - RUST_LOG=info,debug,error
      - REDIS_URL=redis://redis:6379/
      - COBALT_API_KEY=3093a2c7-c1de-43f5-8ec0-96204d67d101
      - LOG_CHAT_ID=-1002822733415
      - ERROR_CHAT_THREAD_ID=-1002822733415
      - ARCHIVE_CHAT_ID=-4919496528
      - TELEGRAM_API_URL=http://telegram_api:8081
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
      - ./fulturate/locales:/app/locales
#    env_file:
#      - ./fulturate/.env

volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local
  telegram_bot_api_data:
    driver: local

networks:
  fulturate-net:
    driver: bridge
